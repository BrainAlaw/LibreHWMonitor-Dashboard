name: Release ZIP

on:
  push:
    tags:
      - 'v*'

jobs:
  build_release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Publish launcher
        run: dotnet publish launcher/LibreHWDashboardLauncher.csproj -c Release -o publish

      - name: Create release ZIP
        shell: pwsh
        run: |
          $releaseRoot = 'release'
          if (Test-Path $releaseRoot) { Remove-Item $releaseRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $releaseRoot | Out-Null
          Copy-Item -Path index.html, server.js, README.md -Destination $releaseRoot
          Copy-Item -Path tools -Destination $releaseRoot -Recurse
          Copy-Item -Path publish\LibreHWDashboard.exe -Destination $releaseRoot
          $zipPath = "LibreHW-Stats-$($env:GITHUB_REF_NAME).zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$releaseRoot\*" -DestinationPath $zipPath
          Write-Output "Release asset: $zipPath"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: "Automated release for ${{ github.ref_name }} containing the zipped LibreHW Monitor dashboard package."
          draft: false
          prerelease: false

      - name: Upload release ZIP asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: LibreHW-Stats-${{ github.ref_name }}.zip
          asset_name: LibreHW-Stats-${{ github.ref_name }}.zip
          asset_content_type: application/zip
