name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI typecheck and tests
        working-directory: ui
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: .NET tests
        run: dotnet test tests/PCMonitor.Tests -c Release

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained single file
        run: dotnet publish src/PCMonitor/PCMonitor.csproj -c Release -p:Version=${{ steps.version.outputs.value }} -o publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.value }}" installer\PCMonitor.iss

      - name: Package portable ZIP and checksums
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.value }}'
          New-Item -ItemType Directory -Path portable | Out-Null
          Copy-Item publish\PCMonitor.exe, README.md, THIRD_PARTY_NOTICES.md -Destination portable
          Compress-Archive -Path portable\* -DestinationPath "release\PCMonitor-$v-portable.zip"
          Get-ChildItem release -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content release\SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/PCMonitor-Setup-*.exe
            release/PCMonitor-*-portable.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
