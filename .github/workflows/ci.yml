name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI typecheck and tests
        working-directory: ui
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: .NET tests
        run: dotnet test tests/PCMonitor.Tests -c Release
