<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LibreHW Command Center</title>
  <style>
    :root {
      --page: #0f1115;
      --panel: #171a21;
      --panel-2: #1d222b;
      --panel-3: #11141a;
      --line: #2d3440;
      --line-soft: #232936;
      --text: #f2f5f8;
      --muted: #9aa6b5;
      --muted-2: #6f7b8c;
      --green: #45d483;
      --yellow: #f2b84b;
      --red: #f26464;
      --blue: #55a7ff;
      --cyan: #4dd6d0;
      --orange: #ff8f45;
      --magenta: #d979ff;
      --radius: 8px;
      --font: "Segoe UI", Roboto, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      color: var(--text);
      font-family: var(--font);
    }

    body {
      min-width: 320px;
    }

    button, input, select {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: 1fr;
      min-height: 100vh;
      width: 100%;
      max-width: 2400px;
      margin: 0 auto;
    }

    .sidebar {
      background: linear-gradient(180deg, #10141b, #0b0d11);
      border-bottom: 1px solid var(--line);
    }

    .sidebar-inner {
      max-width: 2400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      padding: 4px 12px;
    }

    .source-box {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 6px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
    }

    .brand {
      grid-column: 1 / 4;
    }

    .fan-hide {
      position: absolute;
      top: 2px;
      right: 4px;
      background: none;
      border: none;
      color: var(--muted-2);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 2px;
      opacity: 0;
      transition: opacity .15s;
    }
    .fan-card:hover .fan-hide { opacity: 1; }
    .fan-hide:hover { color: var(--red); }

    .icon-button {
      width: 28px;
      height: 26px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: var(--radius);
      cursor: pointer;
    }

    .source-box {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 6px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
    }

    .field {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    label {
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }

    input, select {
      border: 1px solid var(--line);
      background: var(--panel-3);
      color: var(--text);
      border-radius: var(--radius);
      padding: 3px 6px;
      outline: none;
      height: 26px;
      font-size: 12px;
    }

    input:focus, select:focus {
      border-color: var(--blue);
    }

    .content {
      padding: 12px;
      display: grid;
      gap: 10px;
      min-width: 0;
      overflow: hidden;
    }

    .layout {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 10px;
      min-width: 0;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      min-width: 0;
    }

    .panel-header {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line-soft);
    }

    .panel-header > .badge {
      display: none;
    }

    .panel-title {
      margin: 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #d6dde7;
    }

    .panel-body {
      padding: 10px;
      min-width: 0;
    }

    .signal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
      gap: 8px;
      min-width: 0;
    }

    .signal {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-width: 0;
      min-height: 100px;
      padding: 12px;
      background: var(--panel-2);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
    }

    .dial {
      --dial: 0%;
      --dial-color: var(--green);
      width: 68px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      background: conic-gradient(from -90deg, var(--dial-color) var(--dial), #10141b 0);
      border: 1px solid var(--line-soft);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.03),
        0 0 0 1px rgba(0,0,0,.22);
      transform: translateZ(0);
    }

    .dial::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: var(--panel-2);
      border: 1px solid rgba(255,255,255,.04);
      box-shadow: inset 0 0 18px rgba(0,0,0,.28);
    }

    .dial-icon {
      position: relative;
      z-index: 1;
      width: 38px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 35% 25%, rgba(255,255,255,.12), transparent 42%),
        color-mix(in srgb, var(--dial-color) 18%, var(--panel-3));
      border: 1px solid color-mix(in srgb, var(--dial-color) 42%, var(--line-soft));
      box-shadow: 0 0 18px color-mix(in srgb, var(--dial-color) 24%, transparent);
      color: var(--dial-color);
    }

    .dial-icon svg {
      width: 21px;
      height: 21px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .signal-copy {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .signal-head {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .signal-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #dce4ee;
      font-size: 12px;
      font-weight: 700;
    }

    .signal-value {
      font-family: var(--mono);
      font-size: 20px;
      line-height: 1;
      font-weight: 900;
      color: #f5f8fc;
      white-space: nowrap;
    }

    .signal-sub {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 11px;
    }

    .metric-tile {
      display: grid;
      gap: 7px;
      min-height: 100px;
      padding: 12px;
      background: var(--panel-2);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      min-width: 0;
      overflow: hidden;
    }

    .metric-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .metric-title strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #dce4ee;
      font-size: 12px;
    }

    .metric-type {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      white-space: nowrap;
    }

    .metric-value {
      font-family: var(--mono);
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-sub {
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .span-12 { grid-column: span 12; }
    .span-8 { grid-column: span 8; }
    .span-7 { grid-column: span 7; }
    .span-6 { grid-column: span 6; }
    .span-5 { grid-column: span 5; }
    .span-4 { grid-column: span 4; }
    .span-3 { grid-column: span 3; }
    .span-2 { grid-column: span 2; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
    }

    .kpi {
      min-height: 112px;
      background: var(--panel-2);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      padding: 12px;
      display: grid;
      align-content: space-between;
      gap: 8px;
    }

    .kpi .label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .kpi .value {
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .kpi .sub {
      color: var(--muted);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .gauge-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px 10px;
      align-items: center;
      min-height: 28px;
      font-size: 12px;
      min-width: 0;
    }

    .gauge-name {
      color: #dce4ee;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bar {
      grid-column: 1 / -1;
      height: 7px;
      background: #0f131a;
      border: 1px solid #28303c;
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0;
      background: var(--green);
      transition: width .18s linear;
    }

    .gauge-value {
      text-align: right;
      font-family: var(--mono);
      color: #f4f7fb;
      font-size: 12px;
      white-space: nowrap;
    }

    .split {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .score {
      display: grid;
      grid-template-columns: 138px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
    }

    .health-summary {
      display: grid;
      grid-template-columns: 126px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
    }

    .score-ring {
      --score: 0;
      width: 138px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: conic-gradient(var(--green) calc(var(--score) * 1%), #29303b 0);
      display: grid;
      place-items: center;
    }

    .score-ring > div {
      width: 104px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--panel);
      display: grid;
      place-items: center;
      font-size: 30px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .health-summary .score-ring {
      width: 126px;
    }

    .health-summary .score-ring > div {
      width: 94px;
      font-size: 28px;
    }

    .facts {
      display: grid;
      gap: 8px;
    }

    .fact {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      border-bottom: 1px solid var(--line-soft);
      padding-bottom: 8px;
    }

    .fact strong {
      color: var(--text);
      font-family: var(--mono);
      font-weight: 700;
    }

    .alert-list {
      display: grid;
      gap: 8px;
    }

    .alert {
      display: grid;
      grid-template-columns: 6px minmax(0, 1fr);
      gap: 10px;
      align-items: stretch;
      min-height: 42px;
      background: var(--panel-2);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .alert .stripe { background: var(--green); }
    .alert.warn .stripe { background: var(--yellow); }
    .alert.critical .stripe { background: var(--red); }
    .alert-body { padding: 9px 10px; min-width: 0; }
    .alert-title { font-weight: 700; font-size: 13px; }
    .alert-text { color: var(--muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }

    .device-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 8px;
      min-width: 0;
      align-items: start;
    }

    .device-card {
      background: var(--panel-2);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      padding: 9px;
      display: grid;
      gap: 7px;
      min-width: 0;
      overflow: hidden;
    }

    .device-card .signal-grid {
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }

    .device-card .signal,
    .device-card .metric-tile {
      min-height: 88px;
    }

    .device-card .dial {
      width: 58px;
    }

    .device-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
    }

    .device-name {
      font-weight: 700;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .device-subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      font-family: var(--mono);
      white-space: nowrap;
      max-width: 112px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
      gap: 6px;
      min-width: 0;
    }

    .mini {
      background: var(--panel-3);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      padding: 7px;
      min-width: 0;
    }

    .mini-label {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 5px;
    }

    .mini-value {
      font-family: var(--mono);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .metric-stack {
      display: grid;
      gap: 8px;
    }

    .metric-group {
      background: var(--panel-2);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .metric-group h3 {
      margin: 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
    }

    .alert-rail {
      position: sticky;
      top: 18px;
      display: grid;
      gap: 10px;
    }

    .network-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(140px, 220px);
      gap: 10px;
      min-width: 0;
    }



    .traffic-chart {
      min-height: 80px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
        var(--panel-2);
      background-size: 100% 25%, 16.66% 100%, auto;
      overflow: hidden;
    }

    .traffic-chart svg {
      width: 100%;
      height: 80px;
      display: block;
    }

    .traffic-chart .down {
      stroke: var(--blue);
      fill: rgba(85,167,255,.12);
    }

    .traffic-chart .up {
      stroke: var(--cyan);
      fill: rgba(77,214,208,.10);
    }

    .traffic-legend {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      font-family: var(--mono);
    }

    .sparkline {
      height: 42px;
      display: flex;
      align-items: end;
      gap: 2px;
      padding: 4px;
      background: var(--panel-3);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .sparkline span {
      flex: 1;
      min-width: 2px;
      height: 2px;
      background: var(--blue);
      border-radius: 2px 2px 0 0;
      opacity: .9;
    }

    .core-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .core {
      --core-load: 0%;
      --core-color: var(--green);
      position: relative;
      aspect-ratio: 1;
      min-height: 0;
      border-radius: var(--radius);
      border: 1px solid var(--line-soft);
      background:
        radial-gradient(circle at 80% 12%, rgba(255,255,255,.08), transparent 32%),
        var(--panel-2);
      padding: 9px;
      display: grid;
      align-content: space-between;
      overflow: hidden;
    }

    .core-fill {
      position: absolute;
      inset: auto 0 0 0;
      height: var(--core-load);
      background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--core-color) 36%, transparent));
      opacity: .9;
      pointer-events: none;
    }

    .core-index,
    .core-load {
      position: relative;
      z-index: 1;
    }

    .core-index {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .core-load {
      font-family: var(--mono);
      color: #eef3f9;
      font-weight: 700;
      font-size: clamp(11px, 1.2vw, 14px);
      line-height: 1;
    }

    .cooling-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(188px, 1fr));
      gap: 8px;
      min-width: 0;
    }

    .fan-card {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      min-width: 0;
      min-height: 88px;
      padding: 12px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background:
        radial-gradient(circle at 50% 0%, rgba(85,167,255,.14), transparent 40%),
        var(--panel-2);
      overflow: hidden;
    }

    .fan-avatar {
      --fan-color: var(--cyan);
      position: relative;
      width: 54px;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid color-mix(in srgb, var(--fan-color) 55%, var(--line));
      background:
        radial-gradient(circle at center, var(--panel-3) 0 17%, transparent 18%),
        conic-gradient(from 8deg, transparent 0 9deg, color-mix(in srgb, var(--fan-color) 72%, transparent) 10deg 42deg, transparent 43deg 120deg, color-mix(in srgb, var(--fan-color) 72%, transparent) 121deg 153deg, transparent 154deg 240deg, color-mix(in srgb, var(--fan-color) 72%, transparent) 241deg 273deg, transparent 274deg 360deg);
      box-shadow:
        inset 0 0 0 8px rgba(0,0,0,.18),
        0 0 24px color-mix(in srgb, var(--fan-color) 22%, transparent);
    }

    .fan-avatar::after {
      content: "";
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      background: var(--fan-color);
      box-shadow: 0 0 0 4px rgba(15,17,21,.84);
    }

    .fan-copy {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .fan-name,
    .fan-value,
    .fan-sub {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fan-name {
      color: #dce4ee;
      font-size: 12px;
      font-weight: 800;
    }

    .fan-value {
      font-family: var(--mono);
      font-size: 17px;
      font-weight: 900;
      color: var(--text);
    }

    .fan-sub {
      color: var(--muted);
      font-size: 11px;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
    }

    table {
      width: 100%;
      min-width: 920px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--line-soft);
      text-align: left;
      vertical-align: middle;
      font-size: 13px;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #10141b;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 11px;
    }

    tbody tr:hover {
      background: #202632;
    }

    .path {
      color: var(--muted-2);
      font-family: var(--mono);
      font-size: 11px;
      margin-top: 3px;
      overflow-wrap: anywhere;
    }

    .numeric {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .muted { color: var(--muted); }
    .ok { color: var(--green); }
    .warn-text { color: var(--yellow); }
    .bad-text { color: var(--red); }
    .hidden { display: none !important; }

    @media (max-width: 1260px) {
      .span-8, .span-7, .span-6, .span-5, .span-4, .span-3 { grid-column: span 12; }
    }

    @media (max-width: 760px) {
      .content { padding: 12px; }
      .kpi-grid { grid-template-columns: 1fr; }
      .split, .score { grid-template-columns: 1fr; }
      .score-ring { margin: 0 auto; }
      .gauge-row { grid-template-columns: minmax(0, 1fr) auto; }
      .gauge-value { text-align: left; }
      .device-grid { grid-template-columns: 1fr; }
      .signal-grid { grid-template-columns: 1fr; }
      .signal { grid-template-columns: 64px minmax(0, 1fr); }
      .dial { width: 60px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-inner">
      <div class="brand">
        <h1 id="hostName">waiting for telemetry</h1>
      </div>

      <div class="source-box">
        <div class="field">
          <label for="telemetryPort">Telemetry port</label>
          <input id="telemetryPort" type="number" min="1" max="65535" step="1" value="8085" inputmode="numeric">
        </div>
        <div class="field">
          <label for="refreshMs">Refresh</label>
          <select id="refreshMs">
            <option value="1000">1 second</option>
            <option value="2000" selected>2 seconds</option>
            <option value="5000">5 seconds</option>
            <option value="10000">10 seconds</option>
          </select>
        </div>
        <button class="icon-button" id="applySource" title="Apply telemetry port and refresh" aria-label="Apply telemetry port and refresh">↻</button>
      </div>
    </div>
  </aside>
  <main class="app">

    <section class="content">
      <section class="layout" data-section="overview">
        <div class="panel span-12">
          <div class="panel-header">
            <h2 class="panel-title">Major Thermals</h2>
            <span class="badge" id="systemRisk">Calculating</span>
          </div>
          <div class="panel-body">
            <div class="device-grid" id="thermalSummary"></div>
          </div>
        </div>

        <div class="panel span-8">
          <div class="panel-header">
            <h2 class="panel-title">Major Loads</h2>
            <span class="badge">cpu, gpu, memory, storage</span>
          </div>
          <div class="panel-body">
            <div class="device-grid" id="loadSummary"></div>
          </div>
        </div>

        <div class="panel span-4">
          <div class="panel-header">
            <h2 class="panel-title">Network</h2>
            <span class="badge">download and upload</span>
          </div>
          <div class="panel-body">
            <div id="networkSummary"></div>
          </div>
        </div>

      </section>

      <section class="layout" data-section="compute">
        <div class="panel span-4">
          <div class="panel-header">
            <h2 class="panel-title">CPU</h2>
            <span class="badge" id="cpuName">CPU</span>
          </div>
          <div class="panel-body">
            <div id="cpuSummary"></div>
            <div class="core-grid" id="coreGrid"></div>
          </div>
        </div>

        <div class="panel span-4">
          <div class="panel-header">
            <h2 class="panel-title">Power and Cooling</h2>
            <span class="badge" id="powerFanCount">loose model</span>
          </div>
          <div class="panel-body">
            <div class="signal-grid" style="grid-template-columns:repeat(2,1fr)" id="powerSummary"></div>
            <div class="cooling-grid" id="powerCoolingGrid" style="margin-top:6px"></div>
          </div>
        </div>

        <div class="panel span-4" style="display:flex;flex-direction:column">
          <div class="panel-header">
            <h2 class="panel-title">GPU</h2>
            <span class="badge" id="gpuName">GPU</span>
          </div>
          <div class="panel-body" style="display:flex;flex-direction:column;flex:1">
            <div class="device-grid" id="gpuCards" style="grid-template-columns:repeat(3,1fr);align-items:stretch;flex:1"></div>
          </div>
        </div>
      </section>

      <section class="layout" data-section="raw">
        <div class="panel span-12">
          <div class="panel-header">
            <h2 class="panel-title">Raw Sensor Matrix</h2>
            <span class="badge" id="rawCount">0 shown</span>
          </div>
          <div class="panel-body">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Device</th>
                    <th>Sensor</th>
                    <th>Type</th>
                    <th>Min</th>
                    <th>Value</th>
                    <th>Max</th>
                    <th>Health</th>
                  </tr>
                </thead>
                <tbody id="rawTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>
  <script>
    const state = {
      root: null,
      flat: [],
      sensors: [],
      devices: [],
      timer: null,
      inFlight: false,
      pendingRefresh: false,
      lastSignature: '',
      history: new Map(),
      hiddenFans: new Set(JSON.parse(localStorage.getItem('librehw-hiddenfans') || '[]'))
    };

    const dom = id => document.getElementById(id);
    const setText = (id, value) => {
      const element = dom(id);
      if (element) element.textContent = value;
    };
    const telemetryPortInput = dom('telemetryPort');
    const refreshSelect = dom('refreshMs');
    const POWER_ASSUMPTIONS = {
      motherboardWatts: 45,
      ramWatts: 12,
      fansAndCoolingWatts: 8,
      usbWatts: 15,
      monitorCount: 2,
      monitorWatts: 32,
      nvmeWatts: 5,
      sataSsdWatts: 2,
      psuEfficiency: 0.88
    };

    function buildInitialTelemetryControls() {
      const params = new URLSearchParams(window.location.search);
      const savedPort = localStorage.getItem('librehw-port');
      telemetryPortInput.value = params.get('port') || params.get('telemetryPort') || savedPort || '8085';
    }

    function telemetryPort() {
      const port = Number(telemetryPortInput.value);
      if (!Number.isInteger(port) || port < 1 || port > 65535) return 8085;
      return port;
    }

    function parseNumber(value) {
      if (value === undefined || value === null) return null;
      const text = String(value).replace(',', '.');
      if (/nan/i.test(text)) return null;
      const match = text.match(/-?\d+(?:\.\d+)?/);
      if (!match) return null;
      const number = Number(match[0]);
      return Number.isFinite(number) ? number : null;
    }

    function unitOf(value) {
      const text = String(value || '').trim();
      const match = text.match(/[a-zA-Z%°/]+(?:\/s)?$/);
      return match ? match[0] : '';
    }

    function toBaseRate(value) {
      const num = parseNumber(value);
      if (num === null) return 0;
      const text = String(value || '').toLowerCase();
      if (text.includes('gb/s')) return num * 1024 * 1024;
      if (text.includes('mb/s')) return num * 1024;
      if (text.includes('kb/s')) return num;
      return num;
    }

    function watts(sensor) {
      const value = parseNumber(sensor?.value);
      return value === null ? 0 : value;
    }

    function deviceNameFromPath(path) {
      return path[2] || path[1] || path[0] || 'Device';
    }

    function groupNameFromPath(path) {
      return path[3] || '';
    }

    function formatMetricName(text, group) {
      const labels = {
        Temperatures: 'Temperature',
        Powers: 'Power',
        Clocks: 'Clock',
        Load: 'Load',
        Levels: 'Health',
        Data: 'Data',
        Throughput: 'Throughput',
        Fans: 'Fan',
        Controls: 'Control',
        Voltages: 'Voltage',
        Factors: 'Factor'
      };
      const label = labels[group] || group;
      if (!label) return text || 'Sensor';
      if (text && text.toLowerCase() === label.toLowerCase()) return label;
      if (/^temperature \d+$/i.test(text)) return `${label}: ${text}`;
      return text ? `${label}: ${text}` : label;
    }

    function normalize(root) {
      const flat = [];
      function walk(node, parents) {
        const path = [...parents, node.Text || 'Unknown'];
        const deviceName = deviceNameFromPath(path);
        const groupName = groupNameFromPath(path);
        const item = {
          id: node.id,
          text: node.Text || '',
          displayName: formatMetricName(node.Text || '', groupName),
          deviceName,
          groupName,
          min: node.Min || '',
          value: node.Value || '',
          max: node.Max || '',
          type: node.Type || 'Group',
          sensorId: node.SensorId || '',
          image: node.ImageURL || '',
          path,
          pathText: path.join(' / '),
          children: Array.isArray(node.Children) ? node.Children : [],
          number: parseNumber(node.Value),
          maxNumber: parseNumber(node.Max),
          minNumber: parseNumber(node.Min),
          unit: unitOf(node.Value),
          category: categorize(node)
        };
        flat.push(item);
        item.children.forEach(child => walk(child, path));
      }
      walk(root, []);
      state.flat = flat;
      state.sensors = flat.filter(x => x.sensorId);
      state.devices = flat.filter(x => !x.sensorId && x.path.length <= 3 && x.children.length);
    }

    function telemetrySignature(root) {
      const parts = [];
      function walk(node) {
        if (node.SensorId) {
          parts.push(`${node.SensorId}:${node.Value || ''}:${node.Min || ''}:${node.Max || ''}`);
        }
        (Array.isArray(node.Children) ? node.Children : []).forEach(walk);
      }
      walk(root);
      return parts.join('|');
    }

    function categorize(node) {
      const id = String(node.SensorId || '').toLowerCase();
      const text = String(node.Text || '').toLowerCase();
      const type = String(node.Type || '').toLowerCase();
      if (id.includes('/gpu-') || text.includes('gpu') || text.includes('d3d')) return 'gpu';
      if (id.includes('/amdcpu') || id.includes('/intelcpu') || text.includes('cpu') || text.includes('core #')) return 'cpu';
      if (id.includes('/ram') || text.includes('memory') || text.includes('virtual memory')) return 'memory';
      if (id.includes('/nvme') || id.includes('/ssd') || id.includes('/hdd') || text.includes('used space') || text.includes('remaining life')) return 'storage';
      if (id.includes('/nic') || text.includes('network') || text.includes('download') || text.includes('upload')) return 'network';
      if (type.includes('temperature')) return 'thermal';
      return 'other';
    }

    function byText(text, category, type) {
      return state.sensors.find(s =>
        s.text.toLowerCase() === text.toLowerCase() &&
        (!category || s.category === category) &&
        (!type || s.type === type)
      );
    }

    function byContains(parts, category, type) {
      return state.sensors.find(s => {
        const hay = `${s.text} ${s.pathText}`.toLowerCase();
        return parts.every(p => hay.includes(p.toLowerCase())) &&
          (!category || s.category === category) &&
          (!type || s.type === type);
      });
    }

    function colorForPercent(value) {
      if (value === null || !Number.isFinite(value)) return 'var(--muted-2)';
      if (value >= 90) return 'var(--red)';
      if (value >= 75) return 'var(--yellow)';
      return 'var(--green)';
    }

    function tempColor(value) {
      if (value === null || !Number.isFinite(value)) return 'var(--muted-2)';
      if (value >= 85) return 'var(--red)';
      if (value >= 70) return 'var(--yellow)';
      return 'var(--green)';
    }

    function isInvalidCpuTelemetry(sensor) {
      if (!sensor || sensor.category !== 'cpu') return false;
      if (sensor.type === 'Temperature' && sensor.number === 0) return true;
      if (sensor.type === 'Power' && sensor.number === 0) return true;
      if ((sensor.type === 'Clock' || sensor.type === 'Factor') && sensor.number === null) return true;
      return false;
    }

    function storageColor(value) {
      if (value === null || !Number.isFinite(value)) return 'var(--muted-2)';
      if (value >= 95) return 'var(--red)';
      if (value >= 85) return 'var(--yellow)';
      return 'var(--green)';
    }

    function isStorageTemperatureThreshold(sensor) {
      return sensor?.category === 'storage' &&
        sensor?.type === 'Temperature' &&
        /warning temperature|critical temperature/i.test(sensor.text);
    }

    function isLiveTemperature(sensor) {
      return sensor?.type === 'Temperature' && !isStorageTemperatureThreshold(sensor);
    }

    function scoreSensor(sensor) {
      if (!sensor) return { score: 100, level: 'ok', reason: 'No data' };
      const n = sensor.number;
      if (isInvalidCpuTelemetry(sensor)) return { score: 65, level: 'warn', reason: 'CPU telemetry unavailable' };
      if (n === null) return { score: 100, level: 'ok', reason: 'Not numeric' };
      if (/threshold/i.test(sensor.text)) return { score: 100, level: 'ok', reason: 'Reference threshold' };
      if (isStorageTemperatureThreshold(sensor)) return { score: 100, level: 'ok', reason: 'Reference threshold' };
      if (sensor.type === 'Temperature') {
        const critical = sensor.category === 'storage' ? 70 : sensor.text.includes('Hot Spot') ? 95 : 90;
        const warning = sensor.category === 'storage' ? 60 : sensor.text.includes('Hot Spot') ? 83 : 78;
        if (n >= critical) return { score: 20, level: 'critical', reason: 'Critical temperature' };
        if (n >= warning) return { score: 60, level: 'warn', reason: 'High temperature' };
      }
      if (sensor.type === 'Load' && /used space/i.test(sensor.text)) {
        if (n >= 95) return { score: 15, level: 'critical', reason: 'Storage almost full' };
        if (n >= 85) return { score: 60, level: 'warn', reason: 'Storage filling up' };
      }
      if (sensor.type === 'Load' && n >= 98 && !/core #/i.test(sensor.text)) return { score: 70, level: 'warn', reason: 'High utilization' };
      if (sensor.type === 'Level' && /percentage used/i.test(sensor.text)) {
        if (n >= 80) return { score: 25, level: 'critical', reason: 'Storage endurance consumed' };
        if (n >= 50) return { score: 60, level: 'warn', reason: 'Storage endurance aging' };
      }
      if (sensor.type === 'Level' && /remaining life|available spare/i.test(sensor.text)) {
        if (n <= 10) return { score: 25, level: 'critical', reason: 'Storage endurance low' };
        if (n <= 30) return { score: 60, level: 'warn', reason: 'Storage endurance reduced' };
      }
      return { score: 100, level: 'ok', reason: 'Normal' };
    }

    function html(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function renderThermalSummary() {
      const cpuTemp = byText('Core (Tctl/Tdie)', 'cpu', 'Temperature');
      const gpuTemp = byText('GPU Core', 'gpu', 'Temperature');
      const gpuHotspot = byText('GPU Hot Spot', 'gpu', 'Temperature');
      const gpuJunction = byText('GPU Memory Junction', 'gpu', 'Temperature');
      const storageGroups = groupBy(state.sensors.filter(s => s.category === 'storage' && isLiveTemperature(s)), deviceRoot);
      const storageSignals = storageGroups.map(([name, sensors]) => {
        const composite = chooseStorageTemperature(sensors);
        return thermalTile(composite, name, 'NVMe/SSD composite');
      }).join('');

      dom('thermalSummary').innerHTML = `
        <div class="signal-grid">
          ${thermalTile(cpuTemp, 'CPU Tctl/Tdie', cpuTemp?.deviceName)}
          ${thermalTile(gpuTemp, 'GPU Core', gpuTemp?.deviceName)}
          ${thermalTile(gpuHotspot, 'GPU Hot Spot', gpuHotspot?.deviceName)}
          ${thermalTile(gpuJunction, 'GPU Memory', gpuJunction?.deviceName)}
          ${storageSignals}
        </div>
      `;
    }

    function renderHealth() {
      const watched = state.sensors.filter(s =>
        isLiveTemperature(s) ||
        (s.category === 'cpu' && s.type === 'Power' && s.text === 'Package') ||
        (s.category === 'cpu' && s.type === 'Clock' && s.text === 'Core #1') ||
        (s.type === 'Load' && (/used space/i.test(s.text) || s.number >= 90)) ||
        (s.type === 'Level' && /remaining life|available spare|percentage used/i.test(s.text))
      );
      const scored = watched.map(s => ({ sensor: s, ...scoreSensor(s) }));
      const criticalCount = scored.filter(x => x.level === 'critical').length;
      const warningCount = scored.filter(x => x.level === 'warn').length;
      const level = criticalCount > 0 ? 'critical' : warningCount > 0 ? 'warn' : 'ok';
      dom('systemRisk').textContent = level === 'critical' ? 'Critical' : level === 'warn' ? 'Watch' : 'Nominal';
      dom('systemRisk').className = `badge ${level === 'critical' ? 'bad-text' : level === 'warn' ? 'warn-text' : 'ok'}`;
    }

    function gauge(sensor, name = sensor?.text, colorFn = colorForPercent, forcedPct = null) {
      if (!sensor) return '';
      const invalid = isInvalidCpuTelemetry(sensor);
      const isPercentLike = /%$/.test(String(sensor.value || '').trim()) || sensor.type === 'Load' || sensor.type === 'Control' || sensor.type === 'Level';
      const pct = invalid ? 100 : forcedPct !== null ? forcedPct : isPercentLike ? Math.max(0, Math.min(100, sensor.number ?? 0)) : null;
      const value = invalid ? 'unavailable' : sensor.value || '--';
      return `
        <div class="gauge-row">
          <div class="gauge-name" title="${html(sensor.pathText)}">${html(name)}</div>
          <div class="gauge-value">${html(value)}</div>
        </div>
      `;
    }

    function metricPill(sensor, label = sensor?.text) {
      if (!sensor) return '';
      return `
        <div class="mini">
          <div class="mini-label">${html(label)}</div>
          <div class="mini-value">${html(sensor.value || '--')}</div>
        </div>
      `;
    }

    function gaugeIcon(sensor, label = '') {
      const haystack = `${label} ${sensor?.displayName || ''} ${sensor?.text || ''} ${sensor?.deviceName || ''} ${sensor?.category || ''} ${sensor?.type || ''}`.toLowerCase();
      const icons = {
        cpu: '<path d="M7 7h10v10H7z"/><path d="M10 10h4v4h-4z"/><path d="M4 9h3M4 12h3M4 15h3M17 9h3M17 12h3M17 15h3M9 4v3M12 4v3M15 4v3M9 17v3M12 17v3M15 17v3"/>',
        gpu: '<path d="M4 7h13v10H4z"/><path d="M17 10h3v4h-3M7 10h4v4H7z"/><path d="M6 19h9"/>',
        memory: '<path d="M5 8h14v8H5z"/><path d="M7 6v2M10 6v2M13 6v2M16 6v2M7 16v2M10 16v2M13 16v2M16 16v2"/>',
        storage: '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v8c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 10c0 1.7 3.1 3 7 3s7-1.3 7-3"/>',
        network: '<circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2 2.2 3 4.8 3 8s-1 5.8-3 8M12 4c-2 2.2-3 4.8-3 8s1 5.8 3 8"/>',
        power: '<path d="M13 2 5 13h6l-1 9 9-13h-6l1-7z"/>',
        fan: '<circle cx="12" cy="12" r="2"/><path d="M12 10c2.8-5.3 8.6-2.4 6.3 1.7-1.2 2-3.7 2.2-6.3.3M14 13c5.9.4 6.2 6.9 1.5 6.8-2.3-.1-3.8-2.2-3.5-5M10 13c-3.1 5-8.7 1.6-6-2.3 1.3-1.9 3.9-1.8 6 .3"/>',
        thermal: '<path d="M10 14.5V5a2 2 0 1 1 4 0v9.5a4 4 0 1 1-4 0z"/><path d="M12 8v7"/>',
        clock: '<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',
        voltage: '<path d="M7 7h9l1 2h2v6h-2l-1 2H7z"/><path d="M10 11h4M10 14h2"/>',
        load: '<path d="M5 19V5M5 19h14"/><path d="M8 15l3-4 3 2 4-6"/>',
        generic: '<path d="M12 3 21 12 12 21 3 12z"/>'
      };
      let icon = 'generic';
      if (/download|upload|network|pcie|throughput/.test(haystack)) icon = 'network';
      else if (/wall|power|watt|package|board power|internal dc|peripheral/.test(haystack)) icon = 'power';
      else if (/vram|gpu memory|memory controller|gpu|graphics|geforce|radeon|nvidia/.test(haystack)) icon = 'gpu';
      else if (/cpu|processor|core load/.test(haystack)) icon = 'cpu';
      else if (/ram|system memory|memory/.test(haystack)) icon = 'memory';
      else if (/storage|disk|ssd|nvme|used space/.test(haystack)) icon = 'storage';
      else if (/fan|cooling|pump/.test(haystack)) icon = 'fan';
      else if (/temperature|thermal|hot spot|junction/.test(haystack)) icon = 'thermal';
      else if (/clock|frequency/.test(haystack)) icon = 'clock';
      else if (/voltage|volt/.test(haystack)) icon = 'voltage';
      else if (sensor?.type === 'Load' || /load|utilisation|utilization|used/.test(haystack)) icon = 'load';
      return `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[icon]}</svg>`;
    }

    function signal(sensor, label, sub, colorFn = colorForPercent, forcedPct = null) {
      if (!sensor) return '';
      const isPercentLike = /%$/.test(String(sensor.value || '').trim()) || sensor.type === 'Load' || sensor.type === 'Control' || sensor.type === 'Level';
      const pct = forcedPct !== null
        ? forcedPct
        : sensor.type === 'Temperature'
          ? Math.max(0, Math.min(100, sensor.number ?? 0))
          : isPercentLike
            ? Math.max(0, Math.min(100, sensor.number ?? 0))
            : null;
      const colorBasis = sensor.type === 'Temperature' ? sensor.number : pct;
      const color = colorFn(colorBasis === null ? 0 : colorBasis);
      return `
        <article class="signal">
          <div class="dial" style="--dial:${pct === null ? 0 : Math.max(0, Math.min(100, pct))}%;--dial-color:${color}">
            <span class="dial-icon" aria-hidden="true">${gaugeIcon(sensor, label)}</span>
          </div>
          <div class="signal-copy">
            <div class="signal-head">
              <div class="signal-name" title="${html(sensor.pathText)}">${html(label || sensor.displayName || sensor.text)}</div>
              <div class="signal-value">${html(sensor.value || '--')}</div>
            </div>
            <div class="signal-sub">${html(sub || sensor.deviceName || '')}</div>
          </div>
        </article>
      `;
    }

    function valueSignal(label, value, sub, pct = null, color = 'var(--blue)') {
      const safePct = pct === null ? 0 : Math.max(0, Math.min(100, pct));
      return `
        <article class="signal">
          <div class="dial" style="--dial:${safePct}%;--dial-color:${color}">
            <span class="dial-icon" aria-hidden="true">${gaugeIcon(null, label)}</span>
          </div>
          <div class="signal-copy">
            <div class="signal-head">
              <div class="signal-name">${html(label)}</div>
              <div class="signal-value">${html(value)}</div>
            </div>
            <div class="signal-sub">${html(sub || '')}</div>
          </div>
        </article>
      `;
    }

    function thermalTile(sensor, label, sub) {
      if (!sensor) return '';
      const color = tempColor(sensor.number);
      return `
        <article class="metric-tile" style="border-color:${color}">
          <div class="metric-title">
            <strong title="${html(sensor.pathText)}">${html(label || sensor.displayName || sensor.text)}</strong>
          </div>
          <div class="metric-value" style="color:${color}">${html(sensor.value || '--')}</div>
          <div class="metric-sub">${html(sub || sensor.deviceName || '')}</div>
        </article>
      `;
    }

    function numericTile(sensor, label, sub, type = 'VALUE') {
      if (!sensor) return '';
      return `
        <article class="metric-tile">
          <div class="metric-title">
            <strong title="${html(sensor.pathText)}">${html(label || sensor.displayName || sensor.text)}</strong>
            <span class="metric-type">${html(type)}</span>
          </div>
          <div class="metric-value">${html(sensor.value || '--')}</div>
          <div class="metric-sub">${html(sub || sensor.deviceName || '')}</div>
        </article>
      `;
    }

    function mini(label, value) {
      return `<div class="mini"><div class="mini-label">${html(label)}</div><div class="mini-value">${html(value || '--')}</div></div>`;
    }

    function pushHistory(key, value) {
      if (value === null || !Number.isFinite(value)) return;
      const arr = state.history.get(key) || [];
      arr.push(value);
      while (arr.length > 60) arr.shift();
      state.history.set(key, arr);
    }

    function spark(key, color = 'var(--blue)') {
      const values = state.history.get(key) || [];
      const max = Math.max(...values, 1);
      return `<div class="sparkline">${values.map(v => `<span style="height:${Math.max(4, (v / max) * 100)}%;background:${color}"></span>`).join('')}</div>`;
    }

    function formatRate(kilobytesPerSecond) {
      if (!Number.isFinite(kilobytesPerSecond) || kilobytesPerSecond <= 0) return '0 KB/s';
      if (kilobytesPerSecond >= 1024 * 1024) return `${(kilobytesPerSecond / 1024 / 1024).toFixed(2)} GB/s`;
      if (kilobytesPerSecond >= 1024) return `${(kilobytesPerSecond / 1024).toFixed(1)} MB/s`;
      return `${Math.round(kilobytesPerSecond)} KB/s`;
    }

    function chartLine(values, maxValue, width, height) {
      if (!values.length) return '';
      const padded = values.length === 1 ? [0, values[0]] : values;
      return padded.map((value, index) => {
        const x = padded.length === 1 ? 0 : (index / (padded.length - 1)) * width;
        const y = height - ((value / maxValue) * (height - 10)) - 5;
        return `${index === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
      }).join(' ');
    }

    function chartArea(linePath, width, height) {
      if (!linePath) return '';
      return `${linePath} L ${width} ${height} L 0 ${height} Z`;
    }

    function trafficChart(downloadValues, uploadValues) {
      const width = 320;
      const height = 60;
      const maxValue = Math.max(...downloadValues, ...uploadValues, 1);
      const downLine = chartLine(downloadValues, maxValue, width, height);
      const upLine = chartLine(uploadValues, maxValue, width, height);
      return `
        <div class="traffic-chart">
          <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="Network traffic history">
            <path class="down" d="${chartArea(downLine, width, height)}" opacity=".62"></path>
            <path class="up" d="${chartArea(upLine, width, height)}" opacity=".58"></path>
            <path class="down" d="${downLine}" fill="none" stroke-width="2.6"></path>
            <path class="up" d="${upLine}" fill="none" stroke-width="2.2"></path>
          </svg>
        </div>

      `;
    }

    function renderTrends() {
      const trends = [
        ['CPU Total', byText('CPU Total', 'cpu', 'Load'), 'var(--green)'],
        ['GPU Core', byText('GPU Core', 'gpu', 'Load'), 'var(--blue)'],
        ['GPU Hot Spot', byText('GPU Hot Spot', 'gpu', 'Temperature'), 'var(--orange)'],
        ['Memory', byText('Memory', 'memory', 'Load'), 'var(--cyan)'],
        ['Disk Used', state.sensors.filter(s => s.category === 'storage' && /used space/i.test(s.text)).sort((a, b) => (b.number || 0) - (a.number || 0))[0], 'var(--yellow)'],
        ['Download', state.sensors.filter(s => s.category === 'network' && /download speed/i.test(s.text)).sort((a, b) => toBaseRate(b.value) - toBaseRate(a.value))[0], 'var(--magenta)']
      ];
      trends.forEach(([key, sensor]) => pushHistory(key, sensor?.number ?? toBaseRate(sensor?.value)));
      dom('networkSummary').innerHTML = trends.map(([key, sensor, color]) => `
        <article class="device-card">
          <div class="device-head">
            <div class="device-name">${html(key)}</div>
            <span class="badge">${html(sensor?.value || '--')}</span>
          </div>
          ${spark(key, color)}
          <div class="path">${html(sensor ? `${sensor.deviceName} / ${sensor.displayName}` : 'No sensor')}</div>
        </article>
      `).join('');
    }

    function renderCpu() {
      const cpuDevice = state.flat.find(s => s.path.length <= 3 && /ryzen|intel|amd|cpu/i.test(s.text));
      dom('cpuName').textContent = cpuDevice?.text || 'CPU';
      const cpuLoad = byText('CPU Total', 'cpu', 'Load');
      const cpuTemp = byText('Core (Tctl/Tdie)', 'cpu', 'Temperature');
      const cpuPower = byText('Package', 'cpu', 'Power');
      const cpuVoltage = byContains(['Core', 'SVI2'], 'cpu', 'Voltage');
      dom('cpuSummary').innerHTML = `
        <div class="signal-grid" style="grid-template-columns:repeat(2,1fr)">
          ${signal(cpuLoad, 'CPU Total', 'processor utilisation', colorForPercent)}
          ${thermalTile(cpuTemp, 'CPU Tctl/Tdie', cpuTemp?.deviceName)}
          ${numericTile(cpuPower, 'CPU Package', cpuPower?.deviceName, 'POWER')}
          ${numericTile(cpuVoltage, 'Core Voltage', cpuVoltage?.deviceName, 'VOLT')}
        </div>
      `;

      const cores = state.sensors
        .filter(s => s.category === 'cpu' && s.type === 'Load' && /CPU Core #/i.test(s.text))
        .sort((a, b) => a.text.localeCompare(b.text, undefined, { numeric: true }));
      dom('coreGrid').style.gridTemplateColumns = 'repeat(8,1fr)';
      dom('coreGrid').innerHTML = cores.map((c, index) => {
        const load = Math.max(0, Math.min(100, c.number || 0));
        const coreNumber = c.text.match(/#(\d+)/)?.[1] || String(index + 1);
        const color = colorForPercent(c.number);
        return `
        <div class="core" style="--core-load:${load}%;--core-color:${color};border-color:${color}" title="${html(c.pathText)}">
          <div class="core-fill"></div>
          <div class="core-index">Core ${html(coreNumber)}</div>
          <div class="core-load">${html(c.value || '--')}</div>
        </div>
      `;
      }).join('');
    }

    function renderGpu() {
      const gpuDevice = state.flat.find(s => /nvidia|radeon|geforce|gpu/i.test(s.text) && !s.sensorId && s.children.length);
      dom('gpuName').textContent = gpuDevice?.text || 'GPU';
      const coreLoad = byText('GPU Core', 'gpu', 'Load');
      const memoryLoad = byText('GPU Memory', 'gpu', 'Load');
      const mcLoad = byText('GPU Memory Controller', 'gpu', 'Load');
      const powerLoad = byText('GPU Power', 'gpu', 'Load');
      const boardPower = byText('GPU Board Power', 'gpu', 'Load');
      const packagePower = byText('GPU Package', 'gpu', 'Power');
      const coreClock = byText('GPU Core', 'gpu', 'Clock');
      const memoryClock = byText('GPU Memory', 'gpu', 'Clock');
      const gpuTemp = byText('GPU Core', 'gpu', 'Temperature');
      const gpuHotspot = byText('GPU Hot Spot', 'gpu', 'Temperature');
      const fans = state.sensors.filter(s => s.category === 'gpu' && s.type === 'Fan' && toBaseRate(s.value) > 0);
      const vramUsed = byText('GPU Memory Used', 'gpu', 'SmallData');
      const vramTotal = byText('GPU Memory Total', 'gpu', 'SmallData');
      const vramPct = vramUsed && vramTotal ? Math.min(100, (vramUsed.number / vramTotal.number) * 100) : 0;
      dom('loadSummary').innerHTML = `
        <div class="signal-grid">
          ${signal(byText('CPU Total', 'cpu', 'Load'), 'CPU Total', 'processor load', colorForPercent)}
          ${signal(coreLoad, 'GPU Core', 'graphics load', colorForPercent)}
          ${signal(memoryLoad, 'GPU Memory', 'vram load', colorForPercent)}
          ${signal(mcLoad, 'GPU Memory Ctrl', 'controller load', colorForPercent)}
          ${signal(byText('Memory', 'memory', 'Load'), 'System RAM', byText('Memory Used', 'memory', 'Data')?.value, colorForPercent)}
          ${signal(vramUsed, 'VRAM Used', `${vramUsed?.value || '--'} / ${vramTotal?.value || '--'}`, colorForPercent, vramPct)}
          ${signal(powerLoad, 'GPU Power', packagePower?.value || 'board load', colorForPercent)}
        </div>
      `;

      dom('gpuCards').innerHTML = `
        <article class="device-card">
          <div class="device-head"><div class="device-name">Core State</div></div>
          <div class="signal-grid">
            ${signal(coreLoad, 'Core Load', 'GPU utilisation', colorForPercent)}
            ${thermalTile(gpuTemp, 'Core Temp', gpuTemp?.deviceName)}
            ${thermalTile(gpuHotspot, 'Hot Spot', gpuHotspot?.deviceName)}
          </div>
        </article>
        <article class="device-card">
          <div class="device-head"><div class="device-name">Memory State</div></div>
          <div class="signal-grid">
            ${signal(memoryLoad, 'Memory Load', 'VRAM utilisation', colorForPercent)}
            ${signal(mcLoad, 'Memory Controller', 'controller utilisation', colorForPercent)}
            ${signal(vramUsed, 'VRAM Used', `${vramUsed?.value || '--'} / ${vramTotal?.value || '--'}`, colorForPercent, vramPct)}
          </div>
        </article>
        <article class="device-card">
          <div class="device-head"><div class="device-name">Clocks And Power</div></div>
          <div class="signal-grid">
            ${numericTile(coreClock, 'Core Clock', coreClock?.deviceName, 'CLOCK')}
            ${numericTile(memoryClock, 'Memory Clock', memoryClock?.deviceName, 'CLOCK')}
            ${numericTile(packagePower, 'Package Power', packagePower?.deviceName, 'POWER')}
          </div>
        </article>
      `;
    }

    function activeCoolingSensors() {
      const coolingPattern = /fan|pump|cooler|cooling|aio/i;
      const active = state.sensors
        .filter(sensor => {
          const haystack = `${sensor.text} ${sensor.displayName} ${sensor.pathText}`;
          if (sensor.type === 'Fan') return parseNumber(sensor.value) !== null;
          if (sensor.type === 'Control' && coolingPattern.test(haystack)) return sensor.number !== null;
          return false;
        });
      const deduped = new Map();
      active.forEach(sensor => {
        const key = fanKey(sensor);
        const existing = deduped.get(key);
        if (!existing || (existing.type !== 'Fan' && sensor.type === 'Fan')) deduped.set(key, sensor);
      });
      return [...deduped.values()]
        .filter(sensor => !state.hiddenFans.has(fanKey(sensor)))
        .sort((a, b) => {
          const categoryRank = value => value.category === 'cpu' ? 0 : value.category === 'gpu' ? 1 : 2;
          return categoryRank(a) - categoryRank(b) ||
            a.deviceName.localeCompare(b.deviceName, undefined, { numeric: true }) ||
            a.text.localeCompare(b.text, undefined, { numeric: true });
        });
    }

    function fanKey(sensor) {
      const fanNumber = sensor.text.match(/#\d+/)?.[0] || sensor.text.toLowerCase();
      return `${sensor.deviceName}:${fanNumber}`;
    }

    function hideFanKey(key) {
      state.hiddenFans.add(key);
      localStorage.setItem('librehw-hiddenfans', JSON.stringify([...state.hiddenFans]));
      renderPowerSummary();
    }

    function coolingCard(sensor, index) {
      const raw = parseNumber(sensor.value) || 0;
      const isFan = sensor.type === 'Fan';
      const load = isFan ? Math.min(100, raw / 30) : Math.max(0, Math.min(100, raw));
      const color = colorForPercent(load);
      const label = sensor.text.replace(/^fan\s*/i, 'Fan ') || `Fan ${index + 1}`;
      const key = fanKey(sensor);
      return `
        <article class="fan-card" title="${html(sensor.pathText)}" style="position:relative">
          <button class="fan-hide" data-key="${html(key)}" title="Hide this fan">&times;</button>
          <div class="fan-avatar" style="--fan-color:${color}"></div>
          <div class="fan-copy">
            <div class="fan-name">${html(label)}</div>
            <div class="fan-value">${html(sensor.value || '--')}</div>
            <div class="fan-sub">${html(sensor.deviceName)}</div>
          </div>
        </article>
      `;
    }

    function renderThermalCards() {
      const activeFans = activeCoolingSensors();

      dom('thermalCards').innerHTML = `
        <article class="device-card">
          <div class="device-head"><div class="device-name">Cooling</div></div>
          ${activeFans.length ? `<div class="cooling-grid">${activeFans.map(coolingCard).join('')}</div>` : '<div class="muted">No active fan or pump telemetry is currently reported. Idle, zero RPM and unreported fans are hidden.</div>'}
        </article>
      `;
    }

    function deviceRoot(sensor) {
      return sensor.deviceName || sensor.path[2] || sensor.path[1] || 'Device';
    }

    function hardwareKind(sensor) {
      const id = sensor?.sensorId || '';
      if (id.startsWith('/nvme/')) return 'NVMe';
      if (id.startsWith('/ssd/')) return 'SSD';
      if (id.startsWith('/hdd/')) return 'HDD';
      if (id.startsWith('/nic/')) return 'NIC';
      if (id.startsWith('/gpu-')) return 'GPU';
      if (id.includes('cpu')) return 'CPU';
      return sensor?.category || 'device';
    }

    function groupBy(items, keyFn) {
      const map = new Map();
      items.forEach(item => {
        const key = keyFn(item);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(item);
      });
      return [...map.entries()];
    }

    function pickSensor(sensors, predicate, sortFn = null) {
      const matches = sensors.filter(predicate);
      if (!matches.length) return null;
      if (sortFn) matches.sort(sortFn);
      return matches[0];
    }

    function chooseStorageTemperature(sensors) {
      return pickSensor(
        sensors,
        s => isLiveTemperature(s),
        (a, b) => {
          const rank = sensor => {
            const text = sensor.text.toLowerCase();
            if (text.includes('composite')) return 0;
            if (text.includes('temperature #1')) return 1;
            if (text.includes('temperature #2')) return 2;
            if (text.includes('warning')) return 3;
            if (text.includes('critical')) return 4;
            return 5;
          };
          return rank(a) - rank(b);
        }
      );
    }

    function renderNetwork() {
      const groups = groupBy(state.sensors.filter(s => s.category === 'network'), deviceRoot)
        .sort((a, b) => {
          const av = a[1].reduce((sum, s) => sum + toBaseRate(s.value), 0);
          const bv = b[1].reduce((sum, s) => sum + toBaseRate(s.value), 0);
          return bv - av;
        });
      const totalDownload = groups.reduce((sum, [, sensors]) => sum + toBaseRate((sensors.find(s => /download speed/i.test(s.text)) || {}).value), 0);
      const totalUpload = groups.reduce((sum, [, sensors]) => sum + toBaseRate((sensors.find(s => /upload speed/i.test(s.text)) || {}).value), 0);
      pushHistory('Network Download', totalDownload);
      pushHistory('Network Upload', totalUpload);
      const downloadHistory = state.history.get('Network Download') || [totalDownload];
      const uploadHistory = state.history.get('Network Upload') || [totalUpload];
      const dlPeak = Math.max(...downloadHistory, 1);
      const upPeak = Math.max(...uploadHistory, 1);

      dom('networkSummary').innerHTML = `
        <article class="network-card">
          <div class="mini-grid">
            <div class="metric-tile">
              <div class="metric-title"><strong>Download</strong><span class="metric-type">PEAK ${formatRate(dlPeak)}</span></div>
              <div class="metric-value" style="color:var(--blue)">${formatRate(totalDownload)}</div>
            </div>
            <div class="metric-tile">
              <div class="metric-title"><strong>Upload</strong><span class="metric-type">PEAK ${formatRate(upPeak)}</span></div>
              <div class="metric-value" style="color:var(--cyan)">${formatRate(totalUpload)}</div>
            </div>
          </div>
          ${trafficChart(downloadHistory, uploadHistory)}
        </article>
      `;
    }

    function estimatePowerConsumption() {
      const cpuPackage = byText('Package', 'cpu', 'Power');
      const gpuPackage = byText('GPU Package', 'gpu', 'Power');
      const cpuLoad = byText('CPU Total', 'cpu', 'Load');
      const gpuPowerLoad = byText('GPU Board Power', 'gpu', 'Load') || byText('GPU Power', 'gpu', 'Load');
      const storageGroups = groupBy(state.sensors.filter(s => s.category === 'storage'), deviceRoot);
      const nvmeCount = storageGroups.filter(([, sensors]) => hardwareKind(sensors[0]) === 'NVMe').length;
      const sataSsdCount = storageGroups.filter(([, sensors]) => hardwareKind(sensors[0]) === 'SSD').length;

      const cpuMeasured = watts(cpuPackage);
      const cpuEstimated = cpuMeasured > 0 ? cpuMeasured : 35 + ((cpuLoad?.number || 0) / 100) * 80;
      const gpuMeasured = watts(gpuPackage);
      const gpuEstimated = gpuMeasured > 0 ? gpuMeasured : 25 + ((gpuPowerLoad?.number || 0) / 100) * 320;
      const storageEstimated = nvmeCount * POWER_ASSUMPTIONS.nvmeWatts + sataSsdCount * POWER_ASSUMPTIONS.sataSsdWatts;
      const platformEstimated = POWER_ASSUMPTIONS.motherboardWatts + POWER_ASSUMPTIONS.ramWatts + POWER_ASSUMPTIONS.fansAndCoolingWatts;
      const peripheralsEstimated = POWER_ASSUMPTIONS.usbWatts + POWER_ASSUMPTIONS.monitorCount * POWER_ASSUMPTIONS.monitorWatts;
      const measuredDc = cpuMeasured + gpuMeasured;
      const internalDc = cpuEstimated + gpuEstimated + storageEstimated + platformEstimated;
      const wallEstimate = internalDc / POWER_ASSUMPTIONS.psuEfficiency + peripheralsEstimated;

      return {
        cpuEstimated,
        gpuEstimated,
        storageEstimated,
        platformEstimated,
        peripheralsEstimated,
        measuredDc,
        internalDc,
        wallEstimate
      };
    }

    function renderPowerSummary() {
      const estimate = estimatePowerConsumption();
      dom('powerSummary').innerHTML = `
        ${valueSignal('Wall Estimate', `${Math.round(estimate.wallEstimate)} W`, 'PC + monitors + USB, approximate', Math.min(100, estimate.wallEstimate / 7), 'var(--orange)')}
        ${valueSignal('Measured CPU/GPU', `${Math.round(estimate.measuredDc)} W`, 'from LibreHW power sensors', Math.min(100, estimate.measuredDc / 5), 'var(--green)')}
        ${valueSignal('Internal DC', `${Math.round(estimate.internalDc)} W`, 'cpu + gpu + board + ram + storage', Math.min(100, estimate.internalDc / 6), 'var(--blue)')}
        ${valueSignal('Peripherals', `${Math.round(estimate.peripheralsEstimated)} W`, `${POWER_ASSUMPTIONS.monitorCount} monitors + USB estimate`, Math.min(100, estimate.peripheralsEstimated), 'var(--cyan)')}
      `;
      const fans = activeCoolingSensors();
      setText('powerFanCount', fans.length ? `${fans.length} fans` : 'loose model');
      dom('powerCoolingGrid').innerHTML = fans.length
        ? fans.map(coolingCard).join('')
        : '<div class="muted">No active fan or pump telemetry reported.</div>';
    }

    function renderRaw() {
      const rows = state.sensors;
      dom('rawCount').textContent = `${rows.length} shown`;
      dom('rawTable').innerHTML = rows.map(s => {
        const risk = scoreSensor(s);
        return `
          <tr>
            <td><strong>${html(s.deviceName)}</strong><div class="path">${html(hardwareKind(s))}</div></td>
            <td><strong>${html(s.displayName)}</strong><div class="path">${html(s.sensorId)}</div></td>
            <td><span class="badge">${html(s.type)}</span></td>
            <td class="numeric">${html(s.min || '--')}</td>
            <td class="numeric">${html(s.value || '--')}</td>
            <td class="numeric">${html(s.max || '--')}</td>
            <td class="${risk.level === 'critical' ? 'bad-text' : risk.level === 'warn' ? 'warn-text' : 'ok'}">${html(risk.reason)}</td>
          </tr>
        `;
      }).join('');
    }

    function render() {
      setText('hostName', state.root?.Children?.[0]?.Text || 'LibreHW telemetry');
      renderThermalSummary();
      renderHealth();
      renderCpu();
      renderGpu();
      renderNetwork();
      renderPowerSummary();
      renderRaw();
    }

    async function fetchJson() {
      const port = telemetryPort();
      const url = new URL('data.json', window.location.href);
      url.searchParams.set('port', String(port));
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      localStorage.setItem('librehw-port', String(port));
      return response.json();
    }

    function scheduleNextRefresh(delay = Number(refreshSelect.value)) {
      clearTimeout(state.timer);
      if (document.hidden) return;
      state.timer = setTimeout(() => refresh(false), delay);
    }

    async function refresh(manual = false) {
      if (manual) clearTimeout(state.timer);
      if (state.inFlight) {
        state.pendingRefresh = true;
        return;
      }
      state.inFlight = true;
      try {
        const data = await fetchJson();
        const signature = telemetrySignature(data);
        state.root = data;
        if (signature !== state.lastSignature) {
          normalize(data);
          render();
          state.lastSignature = signature;
        }
      } catch {
      } finally {
        state.inFlight = false;
        const delay = state.pendingRefresh ? 0 : Number(refreshSelect.value);
        state.pendingRefresh = false;
        scheduleNextRefresh(delay);
      }
    }

    function restartTimer() {
      scheduleNextRefresh(Number(refreshSelect.value));
    }

    refreshSelect.addEventListener('change', restartTimer);
    telemetryPortInput.addEventListener('change', () => {
      localStorage.setItem('librehw-port', String(telemetryPort()));
      refresh(true);
    });
    dom('applySource').addEventListener('click', () => {
      refresh(true);
    });
    document.addEventListener('click', event => {
      const btn = event.target.closest('.fan-hide');
      if (btn) hideFanKey(btn.dataset.key);
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearTimeout(state.timer);
      } else {
        refresh(true);
      }
    });

    buildInitialTelemetryControls();
    refresh(true);
  </script>
</body>
</html>
